<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina Lab · Control QA</title><style>:root{--cream:#F4EBDD;--sand:#E7D6BE;--sage:#B8C8B0;--sky:#C9D9E4;--rose:#D9B9B2;--terra:#CFA38E;--lav:#C8BDD0;--ink:#6B665E;--white:#FFFDF8;--line:#d4c2aa}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui,sans-serif}.wrap{width:min(1120px,94vw);margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.top a{color:var(--ink);text-decoration:none}.hero{padding:45px 0 25px}.ey{font-size:10px;font-weight:900;letter-spacing:.18em}.hero h1{font:clamp(46px,7vw,82px)/.9 Georgia,serif;margin:12px 0}.hero p{max-width:760px;line-height:1.6;color:#82786c}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px}.ok{padding:14px;background:var(--sage);border-radius:13px;margin-bottom:10px}.warn{padding:14px;background:var(--rose);border-radius:13px;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{margin-top:18px}.item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbf7ef;margin:8px 0}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:var(--sage);font-size:10px;font-weight:900}.bad{background:var(--rose)}.muted{font-size:12px;color:#82786c;line-height:1.5}button{border:0;border-radius:999px;padding:11px 14px;background:var(--terra);color:var(--ink);font-weight:900;cursor:pointer;margin-top:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header class="top wrap"><a href="../">← Ocarina Lab</a><a href="../delivery/">Cabina de entrega →</a></header><main class="wrap"><section class="hero"><div class="ey">OCARINA LAB · QA</div><h1>Antes de enviar,<br>controlar.</h1><p>Auditoría rápida del inventario público. Detecta SKUs repetidos, productos disponibles sin master y estados incoherentes.</p></section><section class="card"><div id="summary"></div><div class="list" id="list"></div><button onclick="location.href='../factory/'">Volver al centro de producción</button></section></main><script>async function run(){const j=await(await fetch('../products.json')).json(),p=j.products||[],skus=new Set(),dupes=[],bad=[];p.forEach(x=>{if(skus.has(x.sku))dupes.push(x.sku);skus.add(x.sku);const files=x.file?[x.file]:(Array.isArray(x.files)?x.files:[]);if(x.status==='available'&&!files.length)bad.push(x)});const s=document.getElementById('summary');s.innerHTML=`<div class="row"><div class="ok"><b>${p.length}</b><br>productos catalogados</div><div class="${bad.length||dupes.length?'warn':'ok'}"><b>${bad.length+dupes.length}</b><br>incidencias detectadas</div></div>`;let html='';if(!bad.length&&!dupes.length)html+='<div class="ok"><b>QA LIMPIO.</b><br>No hay disponibles sin master ni SKUs duplicados.</div>';if(dupes.length)html+=`<div class="warn"><b>SKUs duplicados:</b> ${dupes.join(', ')}</div>`;bad.forEach(x=>html+=`<div class="item"><span class="badge bad">SIN MASTER</span><br><b>${safe(x.sku)}</b> · ${safe(x.name)}<div class="muted">Está marcado como disponible pero no tiene archivo master asociado.</div></div>`);document.getElementById('list').innerHTML=html}function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]))}run().catch(e=>document.getElementById('summary').innerHTML='<div class="warn">No se pudo leer products.json: '+safe(e.message)+'</div>');</script></body></html>
