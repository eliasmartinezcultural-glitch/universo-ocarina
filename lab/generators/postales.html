<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina Lab · Fábrica de Postales</title><style>body{margin:0;background:#111;color:#f4efe4;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(900px,92vw)}h1{font-size:clamp(32px,6vw,64px);margin:0 0 8px}p{color:#bdb7aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}.panel{background:#1d1d1b;border:1px solid #373631;border-radius:18px;padding:20px}label{display:block;margin:12px 0 6px;color:#aaa}input,textarea,select{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #484740;border-radius:10px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}button{margin-top:16px;border:0;border-radius:999px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#d9c79b;color:#111}.preview{aspect-ratio:3/2;background:#eee7d7;color:#25231f;border-radius:14px;padding:7%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}.preview h2{font-size:clamp(28px,5vw,52px);margin:0}.preview small{letter-spacing:3px}.meta{font-size:12px;letter-spacing:2px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{background:#2b2b28;color:#eee}.status{margin-top:15px;font-size:13px;color:#aaa}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Fábrica de Postales</h1><p>Generador interno Ocarina Lab · San Patricio del Chañar</p><section class="grid"><div class="panel"><label>Título</label><input id="title" value="Río Neuquén"><label>Serie</label><input id="series" value="Serie 01"><label>Texto inferior</label><textarea id="caption">Paisaje · agua · valle · Chañar</textarea><label>SKU</label><input id="sku" value="OC-LAB-RIO-001"><div class="row"><button class="primary" onclick="generate()">Generar</button><button onclick="downloadSVG()">Descargar SVG</button></div><div class="status" id="status">Listo para fabricar.</div></div><div class="panel"><div class="preview" id="preview"><div><small>OCARINA LAB</small><h2>Río Neuquén</h2><p>POSTALES DEL RÍO · SERIE 01</p></div><div><strong>Paisaje · agua · valle · Chañar</strong><div class="meta">SAN PATRICIO DEL CHANAR</div></div></div></div></section></main><script>function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]))}function data(){return{title:document.querySelector('#title').value,series:document.querySelector('#series').value,caption:document.querySelector('#caption').value,sku:document.querySelector('#sku').value}}function generate(){let d=data();document.querySelector('#preview').innerHTML='<div><small>OCARINA LAB</small><h2>'+esc(d.title)+'</h2><p>POSTALES DEL RÍO · '+esc(d.series).toUpperCase()+'</p></div><div><strong>'+esc(d.caption)+'</strong><div class="meta">SAN PATRICIO DEL CHANAR · '+esc(d.sku)+'</div></div>';document.querySelector('#status').textContent='Producto generado en memoria. Revisá el preview y descargá el master.'}function downloadSVG(){let d=data();let svg='<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 3000 2000"><rect width="3000" height="2000" fill="#eee7d7"/><path d="M0 1250 C500 950 900 1350 1400 1050 S2300 950 3000 1200 V2000 H0Z" fill="#7fa6a0"/><path d="M0 1160 C600 850 950 1260 1450 980 S2350 900 3000 1100" fill="none" stroke="#f7f1e3" stroke-width="22"/><g fill="#26241f" font-family="Arial,sans-serif"><text x="220" y="350" font-size="100" font-weight="700" letter-spacing="9">'+esc(d.title).toUpperCase()+'</text><text x="225" y="430" font-size="32" letter-spacing="6">POSTALES DEL RÍO · '+esc(d.series).toUpperCase()+'</text><text x="225" y="1660" font-size="38">'+esc(d.caption)+'</text><text x="225" y="1740" font-size="25" letter-spacing="3">SAN PATRICIO DEL CHANAR · '+esc(d.sku)+'</text></g></svg>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=d.sku+'_'+d.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg';a.click();document.querySelector('#status').textContent='Master descargado.'}generate()</script></body></html>
