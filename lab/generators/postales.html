<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina · Postales artísticas</title><style>body{margin:0;background:#F4EBDD;color:#6B665E;font:15px system-ui}.app{width:min(1050px,92vw);margin:35px auto}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel,.art{background:#FFFDF8;border:1px solid #d4c2aa;border-radius:20px;padding:20px}label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d4c2aa;border-radius:10px;font:inherit}textarea{min-height:100px}.art{aspect-ratio:3/2;display:flex;flex-direction:column;justify-content:space-between;background:#E7D6BE}.art h1{font:clamp(35px,6vw,70px) Georgia,serif;line-height:.9}.wm{font-size:9px;letter-spacing:.1em;text-align:right}button{border:0;border-radius:999px;padding:12px 15px;margin-top:12px;background:#CFA38E;color:#6B665E;font-weight:900;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.status{margin-top:12px;padding:12px;background:#C8BDD0;border-radius:12px;font-size:12px;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main class="app"><h1>Fábrica de Postales Artísticas</h1><p>Fotografía real propia/autorizada + dirección artística Ocarina. Entrega: PDF/JPG.</p><section class="grid"><div class="panel"><label>Título</label><input id="title" value="Río Neuquén"><label>Serie</label><input id="series" value="Serie 01"><label>Texto</label><textarea id="caption">Paisaje · agua · valle · Chañar</textarea><label>SKU</label><input id="sku" value="OC-LAB-RIO-001"><label>Fotografía real del Chañar</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div class="row"><button onclick="make('pdf')">MASTER PDF</button><button onclick="make('jpg')">MASTER JPG</button><button onclick="make('all')">ENTREGA COMPLETA</button></div><div class="status" id="status">Listo.</div></div><div class="panel"><div class="art" id="art"><div><small>OCARINA · SAN PATRICIO DEL CHAÑAR</small><h1>Río Neuquén</h1><p>POSTALES DEL RÍO · SERIE 01</p></div><div><p>Paisaje · agua · valle · Chañar</p><div class="wm">OCARINA · SAN PATRICIO DEL CHAÑAR</div></div></div></div></section></main><script src="../core/factory-core.js"></script><script>const $=id=>document.getElementById(id);let photo='';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]))}function svg(){const t=esc($('title').value),s=esc($('series').value),c=esc($('caption').value),k=esc($('sku').value),p=photo?`<image href="${photo}" x="0" y="0" width="3000" height="2000" preserveAspectRatio="xMidYMid slice" opacity=".34"/>`:'';return `<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000"><rect width="3000" height="2000" fill="#E7D6BE"/>${p}<path d="M0 1300 Q650 950 1400 1250 T3000 1150 V2000 H0Z" fill="#B7D1D0"/><path d="M0 1260 Q650 910 1400 1210 T3000 1110" fill="none" stroke="#FFFDF8" stroke-width="24"/><text x="210" y="300" font-family="Georgia" font-size="115" font-weight="700" fill="#6B665E">${t}</text><text x="215" y="390" font-family="Arial" font-size="36" letter-spacing="5" fill="#6B665E">POSTALES DEL RÍO · ${s.toUpperCase()}</text><text x="215" y="1690" font-family="Arial" font-size="40" fill="#6B665E">${c}</text><text x="215" y="1790" font-family="Arial" font-size="26" letter-spacing="3" fill="#6B665E">SAN PATRICIO DEL CHAÑAR · ${k}</text></svg>`}function render(){art.querySelector('h1').textContent=$('title').value;art.querySelectorAll('p')[0].textContent=$('caption').value}async function make(mode){render();try{const s=svg(),k=$('sku').value,t=$('title').value;if(mode==='pdf')await OCARINA_FACTORY.svgToPdf(s,3000,2000,OCARINA_FACTORY.filename(k,t,'MASTER','pdf'));else if(mode==='jpg')await OCARINA_FACTORY.svgToJpg(s,3000,2000,.94,OCARINA_FACTORY.filename(k,t,'MASTER','jpg'));else await OCARINA_FACTORY.exportAll(s,k,t);$('status').textContent='✓ PDF/JPG generado.'}catch(e){$('status').textContent='ERROR: '+e.message}}$('photo').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)};['title','series','caption'].forEach(id=>$(id).oninput=render);render()</script></html>
