<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina · Láminas artísticas</title><style>body{margin:0;background:#F4EBDD;color:#6B665E;font:15px system-ui}.app{width:min(1100px,92vw);margin:35px auto}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel,.art{background:#FFFDF8;border:1px solid #d4c2aa;border-radius:20px;padding:20px}label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d4c2aa;border-radius:10px;font:inherit}textarea{min-height:110px}.art{aspect-ratio:4/3;background:#E7D6BE;display:flex;flex-direction:column;justify-content:space-between}.art h1{font:clamp(40px,6vw,85px) Georgia,serif;line-height:.9}.wm{text-align:right;font-size:9px;letter-spacing:.1em}button{border:0;border-radius:999px;padding:12px 15px;margin:8px 5px 0 0;background:#CFA38E;color:#6B665E;font-weight:900;cursor:pointer}.status{margin-top:12px;padding:12px;background:#C8BDD0;border-radius:12px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main class="app"><h1>Fábrica de Láminas Artísticas</h1><p>Obras de Chañar · fotografía real propia/autorizada · arte editorial Ocarina.</p><section class="grid"><div class="panel"><label>Título</label><input id="title" value="Chañar Rural"><label>Subtítulo</label><input id="sub" value="Tierra · agua · chacras"><label>Descripción</label><textarea id="desc">Una mirada artística al paisaje productivo del valle.</textarea><label>SKU</label><input id="sku" value="OC-LAB-RUR-001"><label>Fotografía real</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="make('pdf')">MASTER PDF</button><button onclick="make('jpg')">MASTER JPG</button><button onclick="make('all')">ENTREGA COMPLETA</button><div class="status" id="status">Listo.</div></div><div class="panel"><div class="art" id="art"><div><small>OCARINA · SAN PATRICIO DEL CHAÑAR</small><h1>Chañar Rural</h1><p>Tierra · agua · chacras</p></div><div><p>Una mirada artística al paisaje productivo del valle.</p><div class="wm">OCARINA · SAN PATRICIO DEL CHAÑAR</div></div></div></div></section></main><script src="../core/factory-core.js"></script><script>const $=id=>document.getElementById(id);let photo='';function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]))}function svg(){const t=esc(title.value),s=esc(sub.value),d=esc(desc.value),k=esc(sku.value),p=photo?`<image href="${photo}" width="3000" height="2250" preserveAspectRatio="xMidYMid slice" opacity=".34"/>`:'';return `<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2250"><rect width="3000" height="2250" fill="#E7D6BE"/>${p}<path d="M0 1500 Q600 1150 1200 1500 T2400 1450 T3000 1500 V2250 H0Z" fill="#DCC8A6"/><path d="M0 1630 Q700 1350 1400 1650 T3000 1600" fill="none" stroke="#B7D1D0" stroke-width="75"/><text x="220" y="320" font-family="Georgia" font-size="130" font-weight="700" fill="#6B665E">${t}</text><text x="225" y="420" font-family="Arial" font-size="45" letter-spacing="6" fill="#6B665E">${s.toUpperCase()}</text><text x="225" y="1900" font-family="Arial" font-size="38" fill="#6B665E">${d}</text><text x="225" y="2010" font-family="Arial" font-size="25" letter-spacing="4" fill="#6B665E">SAN PATRICIO DEL CHAÑAR · ${k}</text></svg>`}function render(){art.querySelector('h1').textContent=title.value;art.querySelectorAll('p')[0].textContent=sub.value;art.querySelectorAll('p')[1].textContent=desc.value}async function make(mode){render();try{const s=svg(),k=sku.value,t=title.value;if(mode==='pdf')await OCARINA_FACTORY.svgToPdf(s,3000,2250,OCARINA_FACTORY.filename(k,t,'MASTER','pdf'));else if(mode==='jpg')await OCARINA_FACTORY.svgToJpg(s,3000,2250,.94,OCARINA_FACTORY.filename(k,t,'MASTER','jpg'));else await OCARINA_FACTORY.exportAll(s,k,t);status.textContent='✓ PDF/JPG generado.'}catch(e){status.textContent='ERROR: '+e.message}}photo.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)};['title','sub','desc'].forEach(id=>$(id).oninput=render);render()</script></html>
