<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina Lab · Fábrica de Láminas</title><style>body{margin:0;background:#111;color:#f4efe4;font:16px system-ui}.app{width:min(1100px,92vw);margin:40px auto}h1{font-size:clamp(34px,6vw,70px);margin:0}p{color:#aaa}.grid{display:grid;grid-template-columns:320px 1fr;gap:24px;margin-top:25px}.panel{background:#1d1d1b;border:1px solid #383733;border-radius:18px;padding:20px}label{display:block;margin:12px 0 6px;color:#aaa}input,textarea{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #484740;border-radius:10px;padding:12px;font:inherit}textarea{min-height:100px}button{margin-top:16px;border:0;border-radius:999px;padding:13px 18px;font-weight:700}.primary{background:#d9c79b}.art{aspect-ratio:4/3;background:#e9e0cd;color:#24231f;border-radius:14px;padding:8%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.art h2{font-size:clamp(38px,6vw,90px);margin:0;line-height:.9}.footer{letter-spacing:3px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>Fábrica de Láminas</h1><p>Productos territoriales · San Patricio del Chañar</p><div class="grid"><div class="panel"><label>Título</label><input id="title" value="Chañar Rural"><label>Subtítulo</label><input id="sub" value="Tierra · agua · chacras"><label>Descripción</label><textarea id="desc">Una mirada artística al paisaje productivo del valle.</textarea><label>SKU</label><input id="sku" value="OC-LAB-RUR-001"><button class="primary" onclick="download()">Fabricar y descargar</button></div><div class="panel"><div class="art" id="art"><div><div class="footer">OCARINA LAB</div><h2>Chañar<br>Rural</h2><p>Tierra · agua · chacras</p></div><div><p>Una mirada artística al paisaje productivo del valle.</p><div class="footer">SAN PATRICIO DEL CHANAR</div></div></div></div></div></main><script>const $=id=>document.getElementById(id);function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]))}function download(){let t=$('title').value,s=$('sub').value,d=$('desc').value,k=$('sku').value;let svg='<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2250" viewBox="0 0 3000 2250"><rect width="3000" height="2250" fill="#e9e0cd"/><path d="M0 1500 Q600 1150 1200 1500 T2400 1450 T3000 1500 V2250 H0Z" fill="#b9ad8e"/><path d="M0 1630 Q700 1350 1400 1650 T3000 1600" fill="none" stroke="#7fa6a0" stroke-width="75"/><g fill="#6d7f57"><path d="M500 1480 l70 -260 l70 260z"/><path d="M700 1500 l55 -220 l55 220z"/><path d="M2350 1500 l65 -240 l65 240z"/></g><g fill="#24231f" font-family="Arial,sans-serif"><text x="220" y="300" font-size="42" letter-spacing="8">OCARINA LAB</text><text x="220" y="850" font-size="150" font-weight="700">'+esc(t)+'</text><text x="225" y="930" font-size="45" letter-spacing="6">'+esc(s).toUpperCase()+'</text><text x="225" y="1900" font-size="38">'+esc(d)+'</text><text x="225" y="1990" font-size="25" letter-spacing="4">SAN PATRICIO DEL CHANAR · '+esc(k)+'</text></g></svg>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=k+'_'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg';a.click()}$('title').addEventListener('input',()=>{});</script></body></html>
