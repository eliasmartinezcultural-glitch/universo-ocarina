<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina · Guías visuales</title><style>body{margin:0;background:#F4EBDD;color:#6B665E;font:15px system-ui}.app{width:min(1050px,92vw);margin:35px auto}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel,.page{background:#FFFDF8;border:1px solid #d4c2aa;border-radius:20px;padding:22px}label{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d4c2aa;border-radius:10px;font:inherit}textarea{min-height:250px}.page{min-height:620px}.page h1{font:52px Georgia,serif;line-height:.95}.page p{white-space:pre-wrap;line-height:1.65}.tag{font-size:10px;letter-spacing:.15em;font-weight:900}.wm{text-align:right;font-size:9px;letter-spacing:.1em}button{border:0;border-radius:999px;padding:12px 15px;margin:8px 5px 0 0;background:#CFA38E;color:#6B665E;font-weight:900;cursor:pointer}.status{margin-top:12px;padding:12px;background:#C8BDD0;border-radius:12px;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><main class="app"><h1>Fábrica de Guías Visuales</h1><p>Guías artísticas y editoriales sobre Chañar. Información factual solo con fuentes verificadas.</p><section class="grid"><div class="panel"><label>Título</label><input id="title" value="Guía esencial del Chañar"><label>Bajada</label><input id="lead" value="Una primera mirada al territorio"><label>Contenido</label><textarea id="body">Esta guía reúne información seleccionada sobre San Patricio del Chañar.\n\nTERRITORIO\nPaisaje, río, chacras y vida cotidiana.\n\nDESCUBRIR\nLugares y experiencias previamente verificadas.\n\nNota editorial: completar únicamente con información comprobada.</textarea><label>SKU</label><input id="sku" value="OC-LAB-GUI-001"><button onclick="make('pdf')">MASTER PDF</button><button onclick="make('jpg')">MASTER JPG</button><button onclick="make('all')">ENTREGA COMPLETA</button><div class="status" id="status">Listo.</div></div><div class="panel"><article class="page"><div class="tag">OCARINA · SAN PATRICIO DEL CHAÑAR</div><h1 id="pt"></h1><b id="pl"></b><p id="pb"></p><div class="wm">OCARINA · SAN PATRICIO DEL CHAÑAR</div></article></div></section></main><script src="../core/factory-core.js"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]));function render(){pt.textContent=title.value;pl.textContent=lead.value;pb.textContent=body.value}function svg(){return `<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="4000"><rect width="3000" height="4000" fill="#F4EBDD"/><circle cx="2600" cy="800" r="500" fill="#B7D1D0" opacity=".6"/><circle cx="300" cy="2900" r="650" fill="#B8C8B0" opacity=".6"/><text x="220" y="280" font-family="Arial" font-size="34" letter-spacing="7" fill="#6B665E">OCARINA · SAN PATRICIO DEL CHAÑAR</text><text x="220" y="650" font-family="Georgia" font-size="150" font-weight="700" fill="#6B665E">${esc(title.value)}</text><text x="220" y="760" font-family="Arial" font-size="48" fill="#6B665E">${esc(lead.value)}</text><text x="220" y="1050" font-family="Arial" font-size="40" fill="#6B665E">${esc(body.value).replace(/\n/g,'</tspan><tspan x="220" dy="75">')}</text><text x="220" y="3750" font-family="Arial" font-size="26" letter-spacing="4" fill="#6B665E">OBRA EDITORIAL OCARINA · ${esc(sku.value)}</text></svg>`}async function make(mode){render();try{const s=svg(),k=sku.value,t=title.value;if(mode==='pdf')await OCARINA_FACTORY.svgToPdf(s,3000,4000,OCARINA_FACTORY.filename(k,t,'MASTER','pdf'));else if(mode==='jpg')await OCARINA_FACTORY.svgToJpg(s,3000,4000,.94,OCARINA_FACTORY.filename(k,t,'MASTER','jpg'));else await OCARINA_FACTORY.exportAll(s,k,t);status.textContent='✓ PDF/JPG generado.'}catch(e){status.textContent='ERROR: '+e.message}}['title','lead','body'].forEach(id=>$(id).oninput=render);render()</script></html>
