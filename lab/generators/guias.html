<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina Lab · Fábrica de Guías</title><style>body{margin:0;background:#111;color:#f4efe4;font:16px system-ui}.app{width:min(1000px,92vw);margin:35px auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:#1d1d1b;border:1px solid #393833;border-radius:18px;padding:20px}label{display:block;margin:12px 0 6px;color:#aaa}input,textarea{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #484740;border-radius:10px;padding:12px;font:inherit}textarea{min-height:260px}button{margin-top:16px;border:0;border-radius:999px;padding:13px 18px;font-weight:700}.primary{background:#d9c79b}.page{background:#f5efe3;color:#27251f;border-radius:8px;padding:50px;min-height:620px}.page h1{font-size:46px;line-height:1;margin-bottom:5px}.page h2{margin-top:35px}.page p{color:#4b483f;line-height:1.6;white-space:pre-wrap}.tag{letter-spacing:3px;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}.page{padding:30px}}</style></head><body><main class="app"><h1>Fábrica de Guías</h1><p>Microguías digitales sobre San Patricio del Chañar.</p><div class="grid"><div class="panel"><label>Título</label><input id="title" value="Guía esencial del Chañar"><label>Bajada</label><input id="lead" value="Una primera mirada al territorio"><label>Contenido</label><textarea id="body">Esta guía reúne información seleccionada sobre San Patricio del Chañar.\n\nSECCIÓN 01\nTerritorio y paisaje.\n\nSECCIÓN 02\nRío, chacras y vida cotidiana.\n\nSECCIÓN 03\nLugares para descubrir.\n\nNota editorial: completar únicamente con información previamente verificada.</textarea><label>SKU</label><input id="sku" value="OC-LAB-GUI-001"><button class="primary" onclick="download()">Fabricar y descargar</button></div><div class="panel"><article class="page"><div class="tag">OCARINA LAB · GUÍA DIGITAL</div><h1 id="pt">Guía esencial del Chañar</h1><strong id="pl">Una primera mirada al territorio</strong><p id="pb"></p><hr><div class="tag">SAN PATRICIO DEL CHANAR</div></article></div></div></main><script>const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]))}function render(){pt.textContent=title.value;pl.textContent=lead.value;pb.textContent=body.value}['title','lead','body'].forEach(x=>$(x).addEventListener('input',render));function download(){render();let k=sku.value,t=title.value,l=lead.value,b=body.value;let html='<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(t)+'</title><style>body{margin:0;background:#eee8dc;color:#27251f;font:17px Georgia,serif}.page{max-width:760px;margin:auto;background:#f7f1e5;min-height:100vh;padding:55px;box-sizing:border-box}h1{font:700 54px system-ui;line-height:.95}.tag{font:12px system-ui;letter-spacing:3px;color:#777}p{line-height:1.7;white-space:pre-wrap}strong{font:20px system-ui}</style><article class="page"><div class="tag">OCARINA LAB · GUÍA DIGITAL</div><h1>'+esc(t)+'</h1><strong>'+esc(l)+'</strong><p>'+esc(b)+'</p><hr><div class="tag">SAN PATRICIO DEL CHANAR · '+esc(k)+'</div></article></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=k+'_'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click()}render()</script></body></html>
