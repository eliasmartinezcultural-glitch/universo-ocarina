<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina Lab · Generador de mapas</title><style>body{margin:0;background:#f3efe5;color:#171714;font-family:system-ui,sans-serif}.wrap{width:min(1050px,92%);margin:auto}.top{padding:22px 0;border-bottom:1px solid #d5cdbd}.grid{display:grid;grid-template-columns:360px 1fr;gap:25px;margin:35px 0}.panel,.preview{background:#fbfaf6;border:1px solid #d5cdbd;padding:22px}label{display:block;font-size:.72rem;font-weight:800;margin:15px 0 6px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfc6b6;background:white;font:inherit}textarea{min-height:100px}button{margin-top:18px;background:#171714;color:white;font-weight:900;cursor:pointer}.preview{min-height:520px;display:flex;align-items:center;justify-content:center}.k{font-size:.65rem;letter-spacing:.16em;color:#55776d;font-weight:900;text-transform:uppercase}h1{font:3rem Georgia,serif;margin:8px 0}.map{width:100%;aspect-ratio:3/2;background:#ded6c5;position:relative;overflow:hidden;border:8px solid #26241f;box-sizing:border-box}.river{position:absolute;width:130%;height:100px;background:#789b96;transform:rotate(-12deg);top:55%;left:-15%;border-top:7px solid #f8f2e6;border-bottom:7px solid #55776d}.terrain{position:absolute;width:80%;height:180px;border:7px solid #9b8f79;transform:rotate(-7deg);left:10%;top:18%}.title{position:absolute;left:6%;top:6%;font:700 clamp(18px,3vw,38px) Georgia,serif;letter-spacing:3px}.foot{position:absolute;left:6%;bottom:5%;font-size:10px;letter-spacing:2px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><a href="index.html">← Fábrica</a></div></header><main class="wrap"><div class="k">GENERADOR 04 · MAPAS ARTÍSTICOS</div><h1>Fabricar un mapa</h1><div class="grid"><section class="panel"><label>Título</label><input id="title" value="Mapa Mi Chañar"><label>Subtítulo</label><input id="sub" value="Interpretación artística del territorio"><label>SKU</label><input id="sku" value="OC-LAB-MAP-001"><label>Nota editorial</label><textarea id="note">NO ES CARTOGRAFÍA OFICIAL · PIEZA ARTÍSTICA OCARINA LAB</textarea><button onclick="make()">FABRICAR Y DESCARGAR SVG</button></section><section class="preview"><div class="map" id="map"><div class="terrain"></div><div class="river"></div><div class="title" id="pvtitle">Mapa Mi Chañar</div><div class="foot" id="pvfoot">INTERPRETACIÓN ARTÍSTICA · OCARINA LAB</div></div></section></div></main><script>const ids=['title','sub','sku','note'];ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{pvtitle.textContent=title.value;pvfoot.textContent=note.value}));function make(){const t=title.value,s=sku.value,n=note.value;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 3000 2000"><rect width="3000" height="2000" fill="#ded6c5"/><rect x="90" y="90" width="2820" height="1820" fill="none" stroke="#26241f" stroke-width="14"/><path d="M-100 1350 Q700 900 1500 1350 T3100 1200 L3100 2100 L-100 2100Z" fill="#789b96"/><path d="M-100 1320 Q700 870 1500 1320 T3100 1170" fill="none" stroke="#f8f2e6" stroke-width="28"/><path d="M400 1050 Q1000 650 1500 900 T2550 800" fill="none" stroke="#9b8f79" stroke-width="70"/><text x="190" y="310" font-family="Georgia,serif" font-size="120" font-weight="700" fill="#26241f">${t}</text><text x="195" y="390" font-family="Arial,sans-serif" font-size="34" fill="#26241f">${s}</text><text x="195" y="1800" font-family="Arial,sans-serif" font-size="28" fill="#26241f">${n}</text><text x="2550" y="1800" font-family="monospace" font-size="24" fill="#26241f">${s}</text></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=s+'_'+t.toLowerCase().replace(/[^a-z0-9]+/gi,'-')+'_v01.svg';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
