<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocarina Lab · Generador de packs</title><style>body{margin:0;background:#f3efe5;color:#171714;font-family:system-ui,sans-serif}.wrap{width:min(900px,92%);margin:auto}.top{padding:22px 0;border-bottom:1px solid #d5cdbd}.panel{margin:35px 0;background:#fbfaf6;border:1px solid #d5cdbd;padding:28px}label{display:block;font-size:.72rem;font-weight:800;margin:15px 0 6px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfc6b6;background:white;font:inherit}textarea{min-height:140px}button{margin-top:18px;background:#171714;color:white;font-weight:900;cursor:pointer}.k{font-size:.65rem;letter-spacing:.16em;color:#55776d;font-weight:900;text-transform:uppercase}h1{font:3rem Georgia,serif}.hint{font-size:.8rem;color:#716c61;line-height:1.5}</style></head><body><header class="top"><div class="wrap"><a href="index.html">← Fábrica</a></div></header><main class="wrap"><div class="panel"><div class="k">GENERADOR 05 · COLECCIONES</div><h1>Fabricar un pack</h1><p class="hint">El pack se construye con productos que ya existen. Usá un SKU por línea. No se inventan archivos: el pack es un índice de piezas reales.</p><label>Nombre del pack</label><input id="name" value="Pack Mi Chañar · Edición 01"><label>SKU</label><input id="sku" value="OC-LAB-PACK-005"><label>Descripción</label><textarea id="desc">Colección digital de piezas del universo visual de San Patricio del Chañar.</textarea><label>SKUs incluidos, uno por línea</label><textarea id="items">OC-LAB-RUR-002
OC-LAB-RIO-007
OC-LAB-VP-004
OC-LAB-POST-008
OC-LAB-POST-009</textarea><button onclick="make()">FABRICAR Y DESCARGAR MANIFIESTO</button></div></main><script>function make(){const n=name.value,s=sku.value,d=desc.value,items=items.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const html=`<!doctype html><meta charset="utf-8"><title>${n}</title><style>body{font-family:system-ui;max-width:850px;margin:60px auto;padding:20px;background:#f3efe5;color:#171714}h1{font-family:Georgia,serif;font-size:48px}li{padding:12px;border-bottom:1px solid #d5cdbd}.meta{color:#55776d;letter-spacing:2px;font-size:12px}</style><div class="meta">OCARINA LAB · PACK</div><h1>${n}</h1><p>${d}</p><h2>Contenido</h2><ol>${items.map(x=>`<li><b>${x}</b></li>`).join('')}</ol><p class="meta">${s} · SAN PATRICIO DEL CHAÑAR</p>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=s+'_manifiesto.html';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
